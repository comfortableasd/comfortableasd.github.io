<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUD QA Audit · 25 Games</title><style>body{background:#0b1020;color:#eef3ff;font:15px/1.6 system-ui;margin:0}main{max-width:1100px;margin:auto;padding:28px 18px}.card{background:#151f33;border:1px solid #30415e;border-radius:12px;padding:15px;margin:12px 0}.tag{padding:3px 8px;border:1px solid #536681;border-radius:20px;font-size:12px;margin-right:5px}.pass{color:#7be0b4}.pending{color:#ffd27e}.fail{color:#ff9c9c}a{color:#9ecbff}h1{font-size:32px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.img{max-width:100%;max-height:300px;object-fit:contain;background:#080c14}.note{color:#bbc8db;font-size:13px}@media(max-width:700px){.cols{grid-template-columns:1fr}}</style></head><body><main><h1>25 款游戏 HUD 三轮质量审查</h1><p>此页记录逐图审查进度。第一轮检查游戏/来源对应关系；第二轮检查原图清晰度和 HUD；第三轮检查每一个 UI 框和坐标。没有通过三轮的截图不应作为训练标注。</p><div id="cards"></div></main><script>const D={"title":"25款游戏 HUD 图像质量审查记录","updated":"2026-11-19","rules":["Round 1: source/game identity and gameplay-vs-artwork check.","Round 2: open original full-resolution image and inspect HUD legibility/cropping.","Round 3: verify every UI identity and ROI coordinate against the exact image.","A box must not be shown as verified unless all three rounds pass."],"games":[{"id":"fallout4","name":"辐射 4","round1":"pass","image":"https://cdn.cheatcc.com/guide_screens/fallout_4/f4_bosq7_4.jpg","source":"https://www.cheatcc.com/guides/fallout-4-guide-walkthrough/factions-brotherhood-of-steel-18/bos-quest-07-show-no-mercy/","notes":"512×512 实机战斗截图已打开检查。确认顶部 Super Mutant 名称/红色敌人 HP、左下玩家绿色 HP、底部罗盘、右下弹药 HUD。红框已按截图布局更新。","betterSources":["https://playcraft.space/gallery/fallout-4/first-person-hud-hp/","https://playcraft.space/gallery/fallout-4/combat-hud-raider-survivalist/"],"round2":"pass","round3":"pass"},{"id":"stalker2","name":"潜行者 2","round1":"pass","image":"https://s.yimg.com/ny/api/res/1.2/_qpYo6_XWXA 标、黄色导航标记、+150 XP 提示。没有可见 HP 条；不作为血条正样本。","round2":"pass","round3":"pass"},{"id":"enshrouded","name":"雾锁王国","round1":"pass","image":"https://images.cgames.de/images/gsgp/287/enshrouded_6272703.jpg","source":"https://www.gamepro.de/galerien/enshrouded%2C136519.html","notes":"512×512 GamePro 战斗截图已打开。确认敌人等级 15 与下方短红色生命条、左上 Miasma 状态/4:29 计时、顶部罗盘与 69m、右上任务目标、底部快捷栏。敌人 HP 框与等级徽标分开。","round2":"pass","round3":"pass"},{"id":"controlres","name":"控制：共振","round1":"pass","image":"https://images.cgames.de/images/gsgp/226/control-resonant_6440293.jpg","source":"https://www.gamepro.de/artikel/control-resonant-test%2C3459783%2Cseite2.html","notes":"512×512 战斗截图检查：确认敌人等级 2、粉色敌人状态条、左下玩家状态条、右下技能图标、右上雷达。两条的准确语义仍未确认为 HP，均保留为未分类状态条。","betterSources":["https://remedy.helpshift.com/hc/en/5-control-resonant/faq/303-accessibility-options-in-control-resonant/"],"round2":"pass","round3":"pass"},{"id":"pragmata","name":"识质存在","round1":"pass","image":"https://cdn.3dnews.ru/assets/external/galleries/2026/04/29/69f24405742eececbb8b457b/feff44591b7ab1e6d99d4ab8a28dbeef.png","source":"https://3dnews.ru/1140905/pragmata-review","notes":"512×512 巴哈姆特媒体试玩实机截图已打开。确认左下 Health 1204/1210 与生命条、右侧黑客网格、敌人附近伤害数字 36。弹药小数字与目标 UI 可能重叠，因此不画框，保留不确定说明。","betterSources":["https://blog.playstation.com/2026/03/17/pragmata-hands-on-report-hack-and-blast-through-a-futuristic-city/"],"round2":"pass","round3":"pass"},{"id":"nioh3","name":"仁王 3","round1":"pass","image":"https://images.squarespace-cdn.com/content/v1/60cb14f95f1f8c5346a99c66/1769733546994-T2T5REREMO69HXNNQQWB/8Nioh%2B3%2Ball%2Bninjutsu.jpg","source":"https://www.100pguides.com/guides/nioh-3-all-martial-arts-and-ninjutsu-locations","notes":"512×512 实机 Boss 战截图已打开。确认顶部 Onryoki Boss HP、左下玩家状态槽、守护灵技能图标和底部操作提示。官方手册明确 Life Gauge 是生命、Ki Gauge 是攻击/闪避消耗资源，Enemy Information 包含敌方 Life 与 Ki。玩家条在低分辨率下仍需更高清原图确认细分边界。","round2":"pass","round3":"pass"},{"id":"dyinglight","name":"消逝的光芒","round1":"pass","image":"https://dragonchasers.com/wp-content/uploads/2015/01/Dying-Light_20150127222508.jpg","source":"https://dragonchasers.com/tag/dying-light/","notes":"512×512 ActuGaming Boss 遭遇截图已打开。确认左上玩家生命数值 200。右上淡色条语义无法确认，故未标注。当前截图 HUD 不完整，仅此数字通过核验。","round2":"pass","round3":"pass"},{"id":"farcry6","name":"孤岛惊魂 6","round1":"pass","image":"https://gamerbraves.sgp1.cdn.digitaloceanspaces.com/2021/10/FCR5-1024x576.jpg","source":"https://www.gamerbraves.com/far-cry-6-review-blowing-up-half-of-yara-to-save-the-other-half-from-fascism-is-fun/","notes":"512×512 实机战斗截图检查：确认小地图/警戒区域、SEARCH ZONE 提示、地点名称、任务文字、右下武器/状态区域。右下条语义不确定，不标为 HP。","round2":"pass","round3":"pass"},{"id":"valheim","name":"英灵神殿","round1":"pass","image":"https://techraptor.net/sites/default/files/2021-02/Valheim%20Elder%20Boss%20Fight%20cover.jpg","source":"https://techraptor.net/gaming/guides/valheim-elder-boss-fight-guide","notes":"512×512 The Elder Boss 战截图已打开。确认顶部 THE ELDER 红色 Boss HP、左上快捷栏、底部耐力条、右侧操作提示及中央 Rock 提示。该图没有玩家 HP，不标注玩家 HP。官方 HUD 资料确认 Boss Health Bar 的显示条件及 Stamina/Eitr 的独立性。","round2":"pass","round3":"pass"},{"id":"starfield","name":"星空","round1":"pass","image":"https://www.gamerguides.com/images/hd/17/252/mantis_base_outdoors-27c27414.jpg.jpeg","source":"https://www.gamerguides.com/starfield/guide/Missions/misc-quests/how-to-complete-the-lair-of-mantis-and-obtain-the-legendary-razorleaf-ship","notes":"512×512 实机战斗截图已打开。确认 DANGER 警告、PIRATE 等级/名称、右下 HEALTH 条与弹药、左下 O2/CO2 腕表。Health 与环境 O2/CO2 读数已分开标注。","round2":"pass","round3":"pass"},{"id":"gearseday","name":"战争机器：事变日","round1":"pass","image":"https://s.yimg.com/lo/mysterio/api/75fc93c02d6b34ba58e05d88f0a4bc7838c8a3713b6a04f22c311ff596d1ffbb/lightyear_networkapi/resizefill_w1200%3Bquality_80%3Bformat_webp/https%3A/media.zenfs.com/en/creative_bloq_161/bf7c6300299030fcc9414f305e6ea19f.jpg","source":"https://tech.yahoo.com/gaming/articles/gears-war-e-day-review-130000458.html","notes":"1200px 实机 Boss Encounter 截图检查：确认右上武器图标、弹药刻度与 508 数字、LT+RT 能力提示、左侧红色受伤反馈。该帧没有玩家或敌人 HP 条，未标为 HP。","betterSources":["https://thegameextras.com/game/gears-of-war-e-day/screenshots/","https://steamdb.info/app/3010850/screenshots/"],"round2":"pass","round3":"pass"},{"id":"ace8","name":"王牌空战 8：希孚之翼","round1":"pass","image":"https://enso-order.acecombat.jp/assets/img/gameplay/basic-operations/img_2-5.webp","source":"https://enso-order.acecombat.jp/gameplay/basic-operations/","notes":"512×512 官方实机 HUD：确认 SPEED 689、ALT 5945、中央准星、队友/任务消息。用于 OCR/飞行 HUD，不是角色 HP 正样本。","round2":"pass","round3":"pass"},{"id":"sub2","name":"深海迷航 2","round1":"pass","image":"https://substackcdn.com/image/fetch/$s_%21PoAi%21%2Cf_auto%2Cq_auto%3Agood%2Cfl_progressive%3Asteep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fb3388f28-a570-4e77-938a-472e742c00d1_3840x2160.png","source":"https://www.gamefile.news/p/three-notes-about-subnautica-2","notes":"512×512 实机探索截图：确认顶部 5m 深度、方位刻度、氧气/状态图标组、底部工具快捷栏。无可见 HP。","round2":"pass","round3":"pass"},{"id":"sub1","name":"深海迷航","round1":"pass","image":"https://nvplay.ru/uploads/images/Reviews/2018/03.08-subnautica/subnautica-02-big.jpg","source":"https://nvplay.ru/games/subnautica-testirovanie-proizvoditelnosti","notes":"512×512 实机探索截图：确认 11m 深度、中央准星、底部生存/氧气图标组与工具快捷栏。无可见 HP。","round2":"pass","round3":"pass"},{"id":"wildlands","name":"幽灵行动：荒野","round1":"pass","image":"https://www.supersoluce.com/sites/default/files/node/174730/ghost_recon_wildlands_-_ocoro_-_dossiers_kingslayer_-09.jpg","source":"https://www.supersoluce.com/soluce/tom-clancy-s-ghost-recon-wildlands/dossiers-kingslayer-d-ocoro","notes":"512×512 Gamepressure 瞄准镜实机截图已打开。确认右下小地图、Sync Shot Cooldown 30、中央敌人标记及左上瞄准镜距离。此帧没有清晰弹药数字，因此未标注弹药。","round2":"pass","round3":"pass"},{"id":"daysgone","name":"往日不再","round1":"pass","image":"https://www.thepixelempire.net/uploads/1/2/1/1/12119064/days-gone-playstation-4-11_orig.png","source":"https://www.thepixelempire.net/days-gone-ps4-review.html","notes":"512×512 E3 Horde 实机截图已打开。确认 CLEAR THE HORDE 目标文字、右上红色尸潮进度条、左下弹药 375、底部绿色玩家状态条和消耗品图标。绿色条作为玩家生命候选，正式 Ground Truth 仍需游戏内图例确认。","round2":"pass","round3":"pass"},{"id":"metro","name":"地铁：2033 重制版","round1":"pass","image":"https://cdn.mobygames.com/screenshots/2886877-metro-2033-redux-playstation-4-check-your-watch-and-keep-track-o.jpg","source":"https://www.mobygames.com/game/68065/metro-2033-redux/screenshots/playstation-4/793357/","notes":"512×512 装备/腕表 HUD 截图：确认装备轮盘和 02:36 滤芯计时。官方手册确认本作没有传统 HP 条，受伤通过画面模糊/血迹反馈。","round2":"pass","round3":"pass"},{"id":"deadspace","name":"死亡空间 重制版（2023）","round1":"pass","image":"https://habrastorage.org/webt/73/cj/75/73cj755nssqfkeh-fkkgp8kvqnk.png","source":"https://habr.com/ru/companies/plarium/articles/493828/","notes":"512×512 已标注 HUD 说明图：明确标出背部 RIG Health Bar 与 Stasis Meter。语义验证通过；此图本身带讲解箭头，不是干净训练图。","round2":"pass","round3":"pass"},{"id":"acorigins","name":"刺客信条：起源","round1":"pass","image":"https://images.cgames.de/images/gsgp/287/assassins-creed-origins_6011946.jpg","source":"https://www.gamepro.de/galerien/assassins_creed_origins%2C132678.html","notes":"512×512 实机战斗截图已打开。确认敌人等级 18、其下短敌人 HP 条、117 伤害数字、+10 EP 经验提示和底部左侧玩家生命条。敌人 HP 框仅覆盖横向条，不包含等级数字。","round2":"pass","round3":"pass"},{"id":"kcd","name":"天国：拯救","round1":"pass","image":"https://media.vandal.net/master/2-2018/2018213164939_5.jpg","source":"https://vandal.elespanol.com/guias-amp/guia-kingdom-come-deliverance-trucos-y-consejos/sistema-de-combate","notes":"512×512 第一人称战斗截图：确认顶部罗盘/战斗标记与底部红色 Health、黄色 Stamina。官方战斗指南确认红色=Health、黄色=Stamina、紫色=Opponent Health。","round2":"pass","round3":"pass"},{"id":"detroit","name":"底特律：变人","round1":"pass","image":"https://www.warlegend.net/wp-content/uploads/vlcsnap-2018-06-26-17h21m32s477.jpg","source":"https://www.warlegend.net/soluce-detroit-become-human-chapitre-31-bataille-pour-detroit-fin/3/","notes":"512×512 QTE 实机截图：确认 △/○ 按键与动作文字、部分 □ 提示及 QTE 轨迹。无 HP 条；作为 OCR/QTE 样本。","round2":"pass","round3":"pass"}]};document.getElementById('cards').innerHTML=D.games.map((g,i)=>'<article class="card"><h2>'+(i+1)+'. '+g.name+'</h2><div><span class="tag '+(g.round1==='pass'?'pass':'pending')+'">第一轮：'+g.round1+'</span><span class="tag pending">第二轮：'+g.round2+'</span><span class="tag pending">第三轮：'+g.round3+'</span></div><div class="cols"><div>'+(g.image?'<img class="img" src="'+g.image+'" alt="'+g.name+'候选截图">':'无图片')+'</div><div><p class="note">'+g.notes+'</p><p><a href="'+g.source+'" target="_blank">来源页面 ↗</a></p>'+(g.betterSources||[]).map(x=>'<p><a href="'+x+'" target="_blank">补充参考 ↗</a></p>').join('')+'</div></div></article>').join('');</script></body></html>
