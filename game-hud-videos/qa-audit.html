<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUD QA Audit · 25 Games</title><style>body{background:#0b1020;color:#eef3ff;font:15px/1.6 system-ui;margin:0}main{max-width:1100px;margin:auto;padding:28px 18px}.card{background:#151f33;border:1px solid #30415e;border-radius:12px;padding:15px;margin:12px 0}.tag{padding:3px 8px;border:1px solid #536681;border-radius:20px;font-size:12px;margin-right:5px}.pass{color:#7be0b4}.pending{color:#ffd27e}.fail{color:#ff9c9c}a{color:#9ecbff}h1{font-size:32px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.img{max-width:100%;max-height:300px;object-fit:contain;background:#080c14}.note{color:#bbc8db;font-size:13px}@media(max-width:700px){.cols{grid-template-columns:1fr}}</style></head><body><main><h1>25 款游戏 HUD 三轮质量审查</h1><p>此页记录逐图审查进度。第一轮检查游戏/来源对应关系；第二轮检查原图清晰度和 HUD；第三轮检查每一个 UI 框和坐标。没有通过三轮的截图不应作为训练标注。</p><div id="cards"></div></main><script>const D={"title":"25款游戏 HUD 图像质量审查记录","updated":"2026-11-19","rules":["Round 1: source/game identity and gameplay-vs-artwork check.","Round 2: open original full-resolution image and inspect HUD legibility/cropping.","Round 3: verify every UI identity and ROI coordinate against the exact image.","A box must not be shown as verified unless all three rounds pass."],"games":[{"id":"fallout4","name":"辐射 4","round1":"pass","image":"https://cdn.cheatcc.com/guide_screens/fallout_4/f4_bosq7_4.jpg","source":"https://www.cheatcc.com/guides/fallout-4-guide-walkthrough/factions-brotherhood-of-steel-18/bos-quest-07-show-no-mercy/","notes":"512×512 实机战斗截图已打开检查。确认顶部 Super Mutant 名称/红色敌人 HP、左下玩家绿色 HP、底部罗盘、右下弹药 HUD。红框已按截图布局更新。","betterSources":["https://playcraft.space/gallery/fallout-4/first-person-hud-hp/","https://playcraft.space/gallery/fallout-4/combat-hud-raider-survivalist/"],"round2":"pass","round3":"pass"},{"id":"stalker2","name":"潜行者 2","round1":"pass","image":"https://s.yimg.com/ny/api/res/1.2/_qpYo6_XWXA ux/tests/test-dying-light-the-beast-702332","notes":"Image visually is an in-vehicle zombie encounter, not a normal on-foot combat HUD. Reject for primary standard-combat HUD reference; retain only as special vehicle scene.","round2":"fail_scene_mismatch","round3":"not_applicable"},{"id":"enshrouded","name":"雾锁王国","round1":"pass","image":"https://images.cgames.de/images/gsgp/287/enshrouded_6272703.jpg","source":"https://www.gamepro.de/galerien/enshrouded%2C136519.html","notes":"512×512 GamePro 战斗截图已打开。确认敌人等级 15 与下方短红色生命条、左上 Miasma 状态/4:29 计时、顶部罗盘与 69m、右上任务目标、底部快捷栏。敌人 HP 框与等级徽标分开。","round2":"pass","round3":"pass"},{"id":"controlres","name":"控制：共振","round1":"pass","image":"https://images.cgames.de/images/gsgp/226/control-resonant_6440293.jpg","source":"https://www.gamepro.de/artikel/control-resonant-test%2C3459783%2Cseite2.html","notes":"Candidate source found; previous enemy HP and player bar labels are not established. Remedy help confirms interface elements can be configured, but no current ROI accepted.","betterSources":["https://remedy.helpshift.com/hc/en/5-control-resonant/faq/303-accessibility-options-in-control-resonant/"],"round2":"pending","round3":"pending"},{"id":"pragmata","name":"识质存在","round1":"pass","image":"https://cdn.3dnews.ru/assets/external/galleries/2026/04/29/69f24405742eececbb8b457b/feff44591b7ab1e6d99d4ab8a28dbeef.png","source":"https://3dnews.ru/1140905/pragmata-review","notes":"512×512 巴哈姆特媒体试玩实机截图已打开。确认左下 Health 1204/1210 与生命条、右侧黑客网格、敌人附近伤害数字 36。弹药小数字与目标 UI 可能重叠，因此不画框，保留不确定说明。","betterSources":["https://blog.playstation.com/2026/03/17/pragmata-hands-on-report-hack-and-blast-through-a-futuristic-city/"],"round2":"pass","round3":"pass"},{"id":"nioh3","name":"仁王 3","round1":"pass","image":"https://images.squarespace-cdn.com/content/v1/60cb14f95f1f8c5346a99c66/1769733546994-T2T5REREMO69HXNNQQWB/8Nioh%2B3%2Ball%2Bninjutsu.jpg","source":"https://www.100pguides.com/guides/nioh-3-all-martial-arts-and-ninjutsu-locations","notes":"512×512 实机 Boss 战截图已打开。确认顶部 Onryoki Boss HP、左下玩家状态槽、守护灵技能图标和底部操作提示。官方手册明确 Life Gauge 是生命、Ki Gauge 是攻击/闪避消耗资源，Enemy Information 包含敌方 Life 与 Ki。玩家条在低分辨率下仍需更高清原图确认细分边界。","round2":"pass","round3":"pass"},{"id":"dyinglight","name":"消逝的光芒","round1":"pass","image":"https://dragonchasers.com/wp-content/uploads/2015/01/Dying-Light_20150127222508.jpg","source":"https://dragonchasers.com/tag/dying-light/","notes":"512×512 ActuGaming Boss 遭遇截图已打开。确认左上玩家生命数值 200。右上淡色条语义无法确认，故未标注。当前截图 HUD 不完整，仅此数字通过核验。","round2":"pass","round3":"pass"},{"id":"farcry6","name":"孤岛惊魂 6","round1":"pass","image":"https://assetsio.gnwcdn.com/237_lJo0JVS.jpg?auto=webp&fit=bounds&format=jpg&height=2048&quality=85&width=2048","source":"https://www.eurogamer.de/far-cry-6-komplettloesung-mit-tipps-und-tricks?page=31","notes":"Image visually shows gameplay, weapon, ammo count 6, weapon indicator, and player status bars on left. Previous ROI boxes should be recalculated against original image.","round2":"pending","round3":"pending"},{"id":"valheim","name":"英灵神殿","round1":"pass","image":"https://techraptor.net/sites/default/files/2021-02/Valheim%20Elder%20Boss%20Fight%20cover.jpg","source":"https://techraptor.net/gaming/guides/valheim-elder-boss-fight-guide","notes":"512×512 The Elder Boss 战截图已打开。确认顶部 THE ELDER 红色 Boss HP、左上快捷栏、底部耐力条、右侧操作提示及中央 Rock 提示。该图没有玩家 HP，不标注玩家 HP。官方 HUD 资料确认 Boss Health Bar 的显示条件及 Stamina/Eitr 的独立性。","round2":"pass","round3":"pass"},{"id":"starfield","name":"星空","round1":"pass","image":"https://www.gamerguides.com/images/hd/17/252/mantis_base_outdoors-27c27414.jpg.jpeg","source":"https://www.gamerguides.com/starfield/guide/Missions/misc-quests/how-to-complete-the-lair-of-mantis-and-obtain-the-legendary-razorleaf-ship","notes":"512×512 实机战斗截图已打开。确认 DANGER 警告、PIRATE 等级/名称、右下 HEALTH 条与弹药、左下 O2/CO2 腕表。Health 与环境 O2/CO2 读数已分开标注。","round2":"pass","round3":"pass"},{"id":"gearseday","name":"战争机器：事变日","round1":"pass","image":"https://img2.wtftime.ru/store/2026/10/01/iy51BS94_amp_wide.jpg","source":"https://wtftime 2/1/1/12119064/days-gone-playstation-4-11_orig.png","source":"https://www.thepixelempire.net/days-gone-ps4-review.html","notes":"512×512 E3 Horde 实机截图已打开。确认 CLEAR THE HORDE 目标文字、右上红色尸潮进度条、左下弹药 375、底部绿色玩家状态条和消耗品图标。绿色条作为玩家生命候选，正式 Ground Truth 仍需游戏内图例确认。","round2":"pass","round3":"pass"},{"id":"metro","name":"地铁：2033 重制版","round1":"pending","image":"https://cdn.mobygames.com/screenshots/2886877-metro-2033-redux-playstation-4-check-your-watch-and-keep-track-o.jpg","source":"https://www.mobygames.com/game/68065/metro-2033-redux/screenshots/playstation-4/793357/","notes":"Current candidate is an equipment/wristwatch view, not standard combat HUD. Find normal gameplay combat frame before ROI.","round2":"pending","round3":"pending"},{"id":"deadspace","name":"死亡空间 重制版（2023）","round1":"pending","image":"https://vigiato.net/wp-content/uploads/2022/12/Dead-Space-Remake.jpg","source":"https://www.pcgamer.com/dead-space-remake-hands-on-preview/","notes":"Need visually confirm character back RIG health spine in this exact image; prior box is not validated.","round2":"pending","round3":"pending"},{"id":"acorigins","name":"刺客信条：起源","round1":"pass","image":"https://images.cgames.de/images/gsgp/287/assassins-creed-origins_6011946.jpg","source":"https://www.gamepro.de/galerien/assassins_creed_origins%2C132678.html","notes":"512×512 实机战斗截图已打开。确认敌人等级 18、其下短敌人 HP 条、117 伤害数字、+10 EP 经验提示和底部左侧玩家生命条。敌人 HP 框仅覆盖横向条，不包含等级数字。","round2":"pass","round3":"pass"},{"id":"kcd","name":"天国：拯救","round1":"pending","image":"https://images.cgames.de/images/gsgp/287/kingdom-come-deliverance-konsolen-screenshots_6022547.jpg","source":"https://www.gamepro.de/galerien/kingdom_come_deliverance%2C133205.html","notes":"Need confirm this image is the combat HUD frame, then distinguish red Health and yellow Stamina accurately.","round2":"pending","round3":"pending"},{"id":"detroit","name":"底特律：变人","round1":"pending","image":"https://www.warlegend.net/wp-content/uploads/vlcsnap-2018-06-26-17h21m32s477.jpg","source":"https://www.warlegend.net/soluce-detroit-become-human-chapitre-31-bataille-pour-detroit-fin/3/","notes":"Likely QTE/choice scene, not HP sample. Need confirm QTE icons/text positions and avoid claiming health bar.","round2":"pending","round3":"pending"}]};document.getElementById('cards').innerHTML=D.games.map((g,i)=>'<article class="card"><h2>'+(i+1)+'. '+g.name+'</h2><div><span class="tag '+(g.round1==='pass'?'pass':'pending')+'">第一轮：'+g.round1+'</span><span class="tag pending">第二轮：'+g.round2+'</span><span class="tag pending">第三轮：'+g.round3+'</span></div><div class="cols"><div>'+(g.image?'<img class="img" src="'+g.image+'" alt="'+g.name+'候选截图">':'无图片')+'</div><div><p class="note">'+g.notes+'</p><p><a href="'+g.source+'" target="_blank">来源页面 ↗</a></p>'+(g.betterSources||[]).map(x=>'<p><a href="'+x+'" target="_blank">补充参考 ↗</a></p>').join('')+'</div></div></article>').join('');</script></body></html>
